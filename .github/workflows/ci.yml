# Same quality gate as azure-pipelines.yml, for students hosting the repo on GitHub.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
      - name: Build Allure report
        if: always()
        run: npm run report
      - name: AI metrics report
        if: always()
        run: npm run metrics -- --sprint "Sprint 1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-metrics
          path: reports
